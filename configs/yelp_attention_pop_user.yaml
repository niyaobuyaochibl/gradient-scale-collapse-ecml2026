# Extended Study – Yelp Attention Fusion with User Context

experiment_name: "yelp_attention_pop_user_ext"
experiment_group: "yelp_extended"

data:
  dataset: "yelp"
  data_dir: "datasets/yelp"

model:
  type: "attention_fusion"
  n_users: 99165
  n_items: 56696
  embedding_dim: 64
  text_dim: 384
  attention:
    input_mode: "popularity"
    hidden_sizes: [64, 16]
    activation: "relu"
    dropout: 0.1
    context_features: ["user_activity"]

training:
  batch_size: 1024
  learning_rate: 0.003
  num_epochs: 30
  early_stopping_patience: 5
  optimizer: "adam"
  weight_decay: 1e-5
  loss_type: "bpr"
  negative_sampling: 4

evaluation:
  metrics: ["recall", "ndcg", "hit", "mrr"]
  k_list: [10]
  eval_batch_size: 256
  eval_frequency: 1

text_encoder:
  use_precomputed: true
  encoder_alias: "minilm"
  encoder_name: "sentence-transformers/all-MiniLM-L6-v2"
  embedding_file: "embeddings/yelp/all-MiniLM-L6-v2.pkl"

logging:
  log_frequency: 200
  save_model: true
  checkpoint_dir: "checkpoints/"

grad_balance:
  method: "gradnorm"
  log_grads: true
  target_ratio: 1.0
  max_scale: 5.0

regularization:
  lambda_mode: "quadratic"
  lambda_alpha: 0.001
  lambda_beta: 0.0

device: "auto"


