# Extended Study – Amazon Fine Food Attention Fusion (Content-conditioned)

experiment_name: "amazonff_attention_concat_ext"
experiment_group: "amazonff_extended"

data:
  dataset: "amazon_fine_food"
  data_dir: "../datasets/amazon_fine_food_300k"

model:
  type: "attention_fusion"
  attention:
    input_mode: "concat"
    hidden_sizes: [64, 16]
    activation: "gelu"
    dropout: 0.1
  n_users: 6690
  n_items: 1769
  embedding_dim: 64
  text_dim: 384

regularization:
  lambda_mode: "none"
  lambda_alpha: 0.0
  lambda_beta: 0.0

grad_balance:
  method: "none"
  log_grads: true
  target_ratio: 1.0
  max_scale: 5.0

training:
  batch_size: 1024
  learning_rate: 0.003
  num_epochs: 50
  early_stopping_patience: 10
  optimizer: "adam"
  weight_decay: 1e-5
  loss_type: "bpr"
  negative_sampling: 4

evaluation:
  metrics: ["recall", "ndcg", "hit", "mrr"]
  k_list: [10]
  eval_batch_size: 512
  eval_frequency: 1

text_encoder:
  use_precomputed: true
  encoder_alias: "minilm"
  encoder_name: "sentence-transformers/all-MiniLM-L6-v2"
  embedding_file: "../embeddings/amazon_fine_food/all-MiniLM-L6-v2.pkl"

logging:
  log_frequency: 100
  save_model: true
  checkpoint_dir: "checkpoints/"

device: "auto"


