# Extended Study – MovieLens-1M Attention Fusion (Content-conditioned)
# This configuration activates the upcoming concat-based gating variant.

experiment_name: "ml1m_attention_concat_ext"
experiment_group: "movielens_extended"

data:
  dataset: "movielens-1m"
  data_dir: "../datasets/ml-1m"

model:
  type: "attention_fusion"
  attention:
    input_mode: "concat"       # uses [e_cf || e_proj] as gating input
    hidden_sizes: [64, 16]
    activation: "gelu"
    dropout: 0.1
  n_users: 6040
  n_items: 3416
  embedding_dim: 64
  text_dim: 384

regularization:
  lambda_mode: "none"
  lambda_alpha: 0.0
  lambda_beta: 0.0

grad_balance:
  method: "none"
  log_grads: true
  target_ratio: 1.0
  max_scale: 5.0

training:
  batch_size: 1024
  learning_rate: 0.003
  num_epochs: 50
  early_stopping_patience: 10
  optimizer: "adam"
  weight_decay: 1e-5
  loss_type: "bpr"
  negative_sampling: 4

evaluation:
  metrics: ["recall", "ndcg", "hit", "mrr"]
  k_list: [10]
  eval_batch_size: 512
  eval_frequency: 1

text_encoder:
  use_precomputed: true
  encoder_alias: "minilm"
  encoder_name: "sentence-transformers/all-MiniLM-L6-v2"
  embedding_file: "../embeddings/ml-1m/all-MiniLM-L6-v2.pkl"

logging:
  log_frequency: 100
  save_model: true
  checkpoint_dir: "checkpoints/"

device: "auto"


